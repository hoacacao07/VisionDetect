; Delivery robot ESP32 firmware (ESP32 DevKit V1, Arduino framework).
;   Build + flash:   pio run -t upload
;   Watch telemetry: pio device monitor
; Pins: include/pins.h   Robot constants: include/robot_config.h
; Pi side of the protocol: src/vision_detection/esp32_link.py

[env:esp32doit-devkit-v1]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = -Wall
